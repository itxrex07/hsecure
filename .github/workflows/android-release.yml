name: android-release
on:
  workflow_dispatch:
    inputs:
      signing_key:
        description: "main = the original ZedSecure key; upload = the second key"
        type: choice
        default: main
        options: [main, upload]
  workflow_call:
    inputs:
      signing_key:
        type: string
        default: main
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Read the version
        id: v
        run: |
          echo "name=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep '^zedsecure.versionCode=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Download Android engines
        run: ./tools/get-cores.sh android
      - name: Check required engines
        run: |
          set -e
          test -s app/libs/zedcore.aar
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libtor libobfs4proxy libsnowflake libconjure libsnispoof libhev-socks5-tunnel libopenconnect libzeptun-jni; do
              test -f "app/src/main/jniLibs/$abi/$lib.so" || echo "::warning::$abi/$lib.so is missing"
            done
          done
      - name: Unlock signing key
        env:
          USE_PLAY: ${{ inputs.signing_key != 'upload' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          set -e
          umask 077
          if [ "$USE_PLAY" = "true" ] && [ -n "${PLAY_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$PLAY_KEYSTORE_BASE64" | base64 -d > release.keystore
            STORE_PW="$PLAY_KEYSTORE_PASSWORD"; KEY_PW="$PLAY_KEY_PASSWORD"; ALIAS="$PLAY_KEY_ALIAS"
            echo "Using PLAY_KEYSTORE_BASE64 signing key"
          elif [ "$USE_PLAY" != "true" ] && [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
            STORE_PW="$KEYSTORE_PASSWORD"; KEY_PW="$KEY_PASSWORD"; ALIAS="$KEY_ALIAS"
            echo "Using KEYSTORE_BASE64 signing key"
          else
            echo "No signing secret configured; generating a temporary release keystore"
            STORE_PW="changeit"; KEY_PW="changeit"; ALIAS="zedsecure"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storepass "$STORE_PW" \
              -keypass "$KEY_PW" \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=ZedSecure Temporary, OU=Build, O=ZedSecure, L=Unknown, ST=Unknown, C=US"
          fi
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PW"
            echo "keyPassword=$KEY_PW"
            echo "keyAlias=$ALIAS"
          } > keystore.properties
      - name: Build minified split APKs
        run: ./gradlew --warning-mode all :app:assembleRelease
      - name: Verify and name separate APKs
        run: |
          set -e
          mkdir -p dist
          V='${{ steps.v.outputs.name }}'
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app/build/outputs/apk/release/app-$abi-release.apk"
            dst="dist/ZedSecure-$V-$abi.apk"
            test -f "$src" || { echo "::error::$src was not built"; exit 1; }
            cp "$src" "$dst"
            "$BT/apksigner" verify --verbose "$dst"
            "$BT/aapt2" dump badging "$dst" | grep -q "native-code: '$abi'" || {
              echo "::error::$dst is not an ABI-specific APK"; exit 1;
            }
          done
          if find dist -iname '*universal*' -print -quit | grep -q .; then
            echo "::error::universal APK must not be released"; exit 1
          fi
          ( cd dist && sha256sum ZedSecure-*.apk > SHA256SUMS-android.txt )
          ls -lh dist
      - name: Forget signing key
        if: always()
        run: shred -u release.keystore keystore.properties 2>/dev/null || rm -f release.keystore keystore.properties
      - uses: actions/upload-artifact@v7
        with:
          name: android-apks-${{ steps.v.outputs.name }}-${{ steps.v.outputs.code }}
          path: dist/*
          retention-days: 30
