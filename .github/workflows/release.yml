name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag version
        id: v
        run: |
          v=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match zedsecure.versionName=$v"; exit 1; }
          echo "name=$v" >> "$GITHUB_OUTPUT"
  android:
    needs: version
    uses: ./.github/workflows/android-release.yml
    secrets: inherit
  windows:
    needs: version
    uses: ./.github/workflows/desktop-release.yml
    secrets: inherit
  publish:
    needs: [version, android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "android-apks-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: "windows-*"
          path: dist
          merge-multiple: true
      - name: Publish GitHub release without universal APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V='${{ needs.version.outputs.name }}'
          for f in "ZedSecure-$V-arm64-v8a.apk" "ZedSecure-$V-armeabi-v7a.apk" "ZedSecure-$V-x86_64.apk" "ZedSecure-$V-x86_64.msi" "ZedSecure-$V-windows-x86_64.zip"; do
            test -f "dist/$f" || { echo "::error::$f is missing"; exit 1; }
          done
          if find dist -iname '*universal*' -print -quit | grep -q .; then
            echo "::error::universal APK detected; refusing to publish"; exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZedSecure $V" \
            --generate-notes
